              - link "Marienplatz" [ref=e645] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Marienplatz_(Freising)?action=edit&redlink=1
            - note [ref=e646]:
              - text: "See also:"
              - link "List of twin towns and sister cities in Germany" [ref=e647] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/List_of_twin_towns_and_sister_cities_in_Germany
            - paragraph [ref=e648]:
              - text: Freising is
              - link "twinned" [ref=e649] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Sister_city
              - text: "with:"
              - superscript [ref=e650]:
