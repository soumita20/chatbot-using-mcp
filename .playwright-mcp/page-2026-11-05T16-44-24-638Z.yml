          - region [ref=e426]:
            - generic [ref=e427]:
              - heading "Location" [level=2] [ref=e428]
              - link "edit" [ref=e430] [cursor=pointer]:
                - /url: /w/index.php?title=Freising&action=edit&section=1
            - paragraph [ref=e431]:
              - text: Freising is the oldest town between
              - link "Regensburg" [ref=e432] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Regensburg
              - text: and
              - link "Bolzano" [ref=e433] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Bolzano
              - text: ", and is located on the"
              - link "Isar" [ref=e434] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Isar
              - text: river in
              - link "Upper Bavaria" [ref=e435] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Upper_Bavaria
              - text: ", north of"
              - link "Munich" [ref=e436] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Munich
              - text: and near the
              - link "Munich International Airport" [ref=e437] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Munich_International_Airport
              - text: ". The city is built on and around two prominent hills: the Cathedral Hill (Domberg) with the former Bishop's Residence and"
              - link "Freising Cathedral" [ref=e438] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Freising_cathedral
              - text: ", and"
              - link "Weihenstephan" [ref=e439] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Weihenstephan
              - text: Hill (Weihenstephaner Berg) with the former
              - link "Weihenstephan Abbey" [ref=e440] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Weihenstephan_Abbey
              - text: ", containing the oldest working brewery in the world. It was also the location of the first recorded tornado in Europe. The city is 448 metres above sea level."
          - region [ref=e441]:
            - generic [ref=e442]:
              - heading "Cultural significance" [level=2] [ref=e443]
              - link "edit" [ref=e445] [cursor=pointer]:
                - /url: /w/index.php?title=Freising&action=edit&section=2
            - paragraph [ref=e446]:
              - text: Freising is one of the oldest settlements in Bavaria, becoming a major religious centre in the early Middle Ages. It is the centre of an important
              - link "diocese" [ref=e447] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Diocese
              - text: ". Some important historical documents were created between 900 and 1200 in its monastery:"
            - list [ref=e448]:
              - listitem [ref=e449]:
                - link "Freising manuscripts" [ref=e450] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Freising_manuscripts
                - text: written in
                - link "Slovenian" [ref=e451] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Slovenian_language
                - text: ", being the first"
                - link "Roman-script" [ref=e452] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Latin_alphabet
                - text: continuous text in a
                - link "Slavic language" [ref=e453] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Slavic_languages
              - listitem [ref=e454]:
                - link "Chronicle or history of the two cities" [ref=e455] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Otto_of_Freising#Chronica_de_duabus_civitatibus
                - text: by
                - link "Otto of Freising" [ref=e456] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Otto_of_Freising
            - paragraph [ref=e457]:
              - text: The above and other scripts from that time can be found in the "Bayerische Staatsbibliothek" (
              - link "Bavarian State Library" [ref=e458] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Bavarian_State_Library
              - text: ) in Munich.
          - region [ref=e459]:
            - generic [ref=e460]:
              - heading "History" [level=2] [ref=e461]
              - link "edit" [ref=e463] [cursor=pointer]:
                - /url: /w/index.php?title=Freising&action=edit&section=3
            - paragraph [ref=e464]:
              - text: Even though archaeological finds show that the area was settled in the
              - link "late Stone Age" [ref=e465] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Stone_Age
              - text: and
              - link "Bronze Age" [ref=e466] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Bronze_Age
              - text: ", no proof has been found yet to suggest a continuous settlement until the 8th century AD."
            - paragraph [ref=e467]:
              - text: Around 700 AD the Frankish
              - link "Agilolfing" [ref=e468] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Agilolfings
              - text: dukes built a simple palace on the highest hill in Freising as part of its
              - link "Duchy of Bavaria" [ref=e469] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Duchy_of_Bavaria
              - text: .
              - superscript [ref=e470]:
                - link "[3]" [ref=e471] [cursor=pointer]:
                  - /url: "#cite_note-3"
            - paragraph [ref=e472]:
              - text: In 724 AD, the Frankish Saint
              - link "Corbinian" [ref=e473] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Corbinian
              - text: was sent to the Duchy of Bavaria by the Catholic Church to
              - link "spread Christianity" [ref=e474] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Christianisation_of_the_Germanic_peoples
              - text: . On the highest hill in Freising, where there was already a simple sanctuary, Corbinian erected a
              - link "Benedictine" [ref=e475] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Benedictines
              - text: monastery and a school, to help preach the Gospel to the
              - link "local people" [ref=e476] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Baiuvarii
              - text: .
            - paragraph [ref=e477]:
              - text: According to his Vita by Bishop
              - link "Arbeo" [ref=e478] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Arbeo_of_Freising
              - text: ", Corbinian was on his way to"
              - link "Rome" [ref=e479] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Rome
              - text: when his
              - link "packhorse" [ref=e480] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Packhorse
              - text: was attacked and killed by a wild bear. By divine power, Corbinian ordered the bear to carry his luggage over the
              - link "Alps" [ref=e481] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Alps
              - text: . When he finally arrived in Rome he let the bear free. The saddled bear is still the symbol of the city, displayed in the coat of arms, as well as statues and paintings.
              - superscript [ref=e482]:
                - link "[4]" [ref=e483] [cursor=pointer]:
                  - /url: "#cite_note-4"
              - text: After Corbinian's death,
              - link "Saint Boniface" [ref=e484] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Saint_Boniface
              - text: established Freising as a Catholic
              - link "diocese" [ref=e485] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Diocese
              - text: . Between 764–783, Bishop
              - link "Arbeo" [ref=e486] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Arbeo
              - text: founded a library and a
              - link "scriptorium" [ref=e488] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Scriptorium
              - text: (writing room) at the abbey. The settlement started to become a religious centre.
            - paragraph [ref=e489]:
              - text: The
              - link "earliest recorded tornado" [ref=e490] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Tornado_records
              - text: in Europe struck Freising in 788.
              - superscript [ref=e491]:
                - link "[5]" [ref=e492] [cursor=pointer]:
                  - /url: "#cite_note-5"
              - superscript [ref=e493]:
                - link "[6]" [ref=e494] [cursor=pointer]:
                  - /url: "#cite_note-6"
            - paragraph [ref=e495]:
              - text: The mortal remains of
              - link "Pope Alexander I" [ref=e496] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Pope_Alexander_I
              - text: are said to have been transferred to Freising in 834. In 996, Freising received city rights from Emperor
              - link "Otto III" [ref=e497] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Otto_III
              - text: .
            - paragraph [ref=e498]:
              - text: As early as the 10th century, in order to collect additional revenue, monks were sent from Freising down the
              - link "Isar" [ref=e499] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Isar
              - text: River to build a toll bridge on the
              - link "Salt Road" [ref=e500] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Salt_Road
              - text: between Salzburg and Augsburg. This village would be later known as München (or
              - link "Munich" [ref=e501] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Munich
              - text: ", which means 'of the monks'). By 1158,"
              - link "Duke Henry the Lion" [ref=e502] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Henry_the_Lion
              - text: destroyed the bridge and customs building and built new ones closer to his home further downriver, (near the center of modern downtown Munich), so that he could collect the revenue instead.
              - superscript [ref=e503]:
                - link "[7]" [ref=e504] [cursor=pointer]:
                  - /url: "#cite_note-7"
            - paragraph [ref=e505]:
              - text: The construction of the
              - link "Freising Cathedral" [ref=e506] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Freising_Cathedral
              - text: in its current
              - link "Romanesque" [ref=e507] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Romanesque_architecture
              - text: style started in 1159 and was completed in 1205. The Romanesque wooden ceiling was replaced by a gothic vault in 1481–1483.
              - superscript [ref=e508]:
                - link "[8]" [ref=e509] [cursor=pointer]:
                  - /url: "#cite_note-8"
            - paragraph [ref=e510]:
              - text: Freising went through difficult times during the
              - link "Thirty Years' War" [ref=e511] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Thirty_Years'_War
              - text: . In 1632, the Swedish King
              - link "Gustavus Adolphus" [ref=e512] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Gustavus_Adolphus_of_Sweden
              - text: came through Freising on his way to Munich. He demanded 30,000 guilders as the sum to protect the city from destruction. Nevertheless, his army sacked the city. Hunger and plague raged when the Swedes invaded the city again in 1646. In 1674, the Church placed a statue of the Virgin Mary in the city square as a sign that war and plague had been overcome.
              - superscript [ref=e513]:
                - link "[9]" [ref=e514] [cursor=pointer]:
                  - /url: "#cite_note-9"
            - paragraph [ref=e515]:
              - text: A wave of
              - link "witch hunts" [ref=e516] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Witch-hunt
              - text: and trials broke out from 1715–1717 in Freising, and again in 1721–1723. Most of the accused were child beggars. Several children were executed.
              - superscript [ref=e517]:
                - link "[10]" [ref=e518] [cursor=pointer]:
                  - /url: "#cite_note-10"
            - paragraph [ref=e519]:
              - text: In 1802/1803 Bavaria fell under the influence of Napoleonic France and church-controlled lands were
              - link "secularized" [ref=e520] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/German_mediatisation
              - text: . In Freising, the more than thousand-year-old bishopric was abolished. The Roman Catholic Church lost most of its properties and authority over the city.
              - superscript [ref=e521]:
                - link "[11]" [ref=e522] [cursor=pointer]:
                  - /url: "#cite_note-11"
              - text: Although the seat of the
              - link "diocese" [ref=e523] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Roman_Catholic_Archdiocese_of_Munich_and_Freising
              - text: was moved to Munich in 1821, including the elevation to an archdiocese, Freising has remained the seat of diocesan administration until today.
              - superscript [ref=e524]:
                - text: "["
                - link "clarification needed" [ref=e526] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Wikipedia:Please_clarify
                - text: "]"
              - text: The Diocesan Museum is located in Freising.
              - superscript [ref=e527]:
                - link "[12]" [ref=e528] [cursor=pointer]:
                  - /url: "#cite_note-12"
            - paragraph [ref=e529]:
              - text: In 1858 the
              - link "Bavarian Eastern Railway Company" [ref=e530] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Bavarian_Eastern_Railway_Company
              - text: built the first railway line from Munich to Freising, Landshut and Regensburg for passenger and rail traffic.
              - superscript [ref=e531]:
                - link "[13]" [ref=e532] [cursor=pointer]:
                  - /url: "#cite_note-13"
            - paragraph [ref=e533]:
              - text: Near the
              - link "end of the Second World War" [ref=e534] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Western_Allied_invasion_of_Germany
              - text: ", Allied aircraft bombed Freising on 18 April 1945. By 30 April, units of the US Army arrived in Freising."
              - superscript [ref=e535]:
                - link "[14]" [ref=e536] [cursor=pointer]:
                  - /url: "#cite_note-14"
            - paragraph [ref=e537]:
              - text: In 1998,
              - link "Mamdouh Mahmud Salim" [ref=e538] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Mamdouh_Mahmud_Salim
              - text: ", also known as Abu Hajir al-Iraqi, a key figure in the founding of"
              - link "al-Qaeda" [ref=e539] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Al-Qaeda
              - text: and a trusted associate of
              - link "Osama Bin Laden" [ref=e540] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Osama_bin_Laden
              - text: ", was apprehended in Freising."
              - superscript [ref=e541]:
                - link "[15]" [ref=e542] [cursor=pointer]:
                  - /url: "#cite_note-:0-15"
            - paragraph [ref=e543]:
              - text: In 2006,
              - link "Pope Benedict XVI" [ref=e544] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Pope_Benedict_XVI
              - text: visited Freising during a papal visit. He was formerly archbishop of Munich/Freising from 1977 to 1982.
              - superscript [ref=e545]:
                - link "[16]" [ref=e546] [cursor=pointer]:
                  - /url: "#cite_note-16"
          - region [ref=e547]:
            - generic [ref=e548]:
              - heading "Education and research" [level=2] [ref=e549]
              - link "edit" [ref=e551] [cursor=pointer]:
                - /url: /w/index.php?title=Freising&action=edit&section=4
            - region [ref=e552]:
              - generic [ref=e553]:
                - heading "Schools" [level=3] [ref=e554]
                - link "edit" [ref=e556] [cursor=pointer]:
                  - /url: /w/index.php?title=Freising&action=edit&section=5
              - paragraph [ref=e557]: There are several elementary schools in the city of Freising. The St. Korbinian elementary school is located in the city center, the Neustift elementary school in Neustift, the St. Lantbert elementary school in Lerchenfeld and the Paul-Gerhardt elementary school in the north of the city. Another elementary school is the Vötting Elementary School, to which the schoolhouse in Pulling also belongs.
              - paragraph [ref=e558]:
                - text: Secondary schools include the three secondary schools Neustift, Paul-Gerhard and Lerchenfeld. The first two are located at the sites of the elementary schools of the same names. The Karl-Meichelbeck-Realschule is located in the immediate vicinity of the Paul-Gerhard-Schule. At Guten Änger in Lerchenfeld, the new
                - link "Montessori school" [ref=e559] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Montessori_school
                - text: building was opened in 2015 and a second
                - link "Realschule" [ref=e560] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Realschule
                - text: in 2018. The Wippenhauser Straße is home to the Wirtschaftsschule and the
                - link "Fachoberschule" [ref=e561] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Fachoberschule
                - text: /
                - link "Berufsoberschule" [ref=e562] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Berufsoberschule
                - text: . The oldest of Freising's three high schools is the Dom-Gymnasium on the Domberg. The Camerloher-Gymnasium is one of the few artistic grammar schools. The
                - link "Josef-Hofmiller-Gymnasium" [ref=e563] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Josef-Hofmiller-Gymnasium
                - text: ", which emerged from the Dom-Gymnasium, is Freising's largest grammar school."
              - paragraph [ref=e564]:
                - text: The Freising Vocational School and the Vocational School for Child Care are located in the same building. The latter is a full-time school that trains
                - link "pediatric nurses" [ref=e565] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Pediatric_nurses
                - text: in two years. The vocational school for nursing is affiliated with the Freising Clinic. The Weihenstephan State Vocational School for
                - link "Floral Art" [ref=e566] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Floral_art
                - text: offers advanced training to become a state-certified designer for floral art.
            - region [ref=e567]:
              - generic [ref=e568]:
                - heading "Universities" [level=3] [ref=e569]
                - link "edit" [ref=e571] [cursor=pointer]:
                  - /url: /w/index.php?title=Freising&action=edit&section=6
              - paragraph [ref=e572]:
                - text: The Freising-Weihenstephan campus is an extensive complex of higher education institutions and research institutes in the western urban area of Freising, in the
                - link "Weihenstephan" [ref=e573] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Weihenstephan
                - text: and Vötting districts. It has been developed into the so-called "Green Center of Bavaria" for decades and continues to be modernized and designed as a "science and research campus". It includes not only the "
                - link "Center of Life Sciences" [ref=e574] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/TUM_School_of_Life_Sciences
                - text: "\", the Weihenstephan Science Center for Nutrition, Land Use and Environment of the"
                - link "Technical University of Munich" [ref=e575] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Technical_University_of_Munich
                - text: ", but also the most important part of the"
                - link "Weihenstephan-Triesdorf University of Applied Sciences" [ref=e576] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Weihenstephan-Triesdorf_University_of_Applied_Science
                - text: .
              - paragraph [ref=e577]:
                - text: The Freising Clinic is an academic teaching hospital of the
                - link "Technical University of Munich" [ref=e578] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Technical_University_of_Munich
                - text: . It is located north of the old town.
            - region [ref=e579]:
              - generic [ref=e580]:
                - heading "Research and education centers" [level=3] [ref=e581]
                - link "edit" [ref=e583] [cursor=pointer]:
                  - /url: /w/index.php?title=Freising&action=edit&section=7
              - paragraph [ref=e584]:
                - text: Several research centers have been established in the vicinity of the two universities, i.e. mostly located on campus. The TUM Weihenstephan Research Center for Brewing and Food Quality, the TUM Central Institute for Nutrition and Food Research and the TUM Hans Eisenmann Center for Agricultural Sciences belong to the
                - link "Technical University of Munich" [ref=e585] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Technical_University_of_Munich
                - text: . The Bavarian State Institute of Agriculture and the Bavarian State Institute of Forestry and Forestry are authorities of the
                - link "Free State of Bavaria" [ref=e586] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Bavaria
                - text: .
              - paragraph [ref=e587]: Other non-university institutions include the German Research Institute for Food Chemistry, the Fraunhofer Institute for Process Engineering and Packaging, DEULA Bavaria and the IZB Freising-Weihenstephan start-up center for green biotechnology.
              - paragraph [ref=e588]: In addition to the natural sciences and technology, there are facilities in the area of religious education. The Institut für Theologische und Pastorale Fortbildung Freising is dedicated to the continuing education of pastoral counselors. The Kardinal-Döpfner-Haus educational center is also located in the former residence on the Domberg. Further offers are provided by the Katholisches Kreisbildungswerk and the Pallotti-Haus, a Christian educational house and therapy center.
            - region [ref=e589]:
              - generic [ref=e590]:
                - heading "Libraries" [level=3] [ref=e591]
                - link "edit" [ref=e593] [cursor=pointer]:
                  - /url: /w/index.php?title=Freising&action=edit&section=8
              - paragraph [ref=e594]:
                - text: The oldest library in Freising is the Freising Cathedral Library, located on the Domberg. This was founded by Bishop Arbeo and is the central library of the
                - link "Archdiocese of Munich and Freising" [ref=e595] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Roman_Catholic_Archdiocese_of_Munich_and_Freising
                - text: and one of the largest church libraries in
                - link "Germany" [ref=e596] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Germany
                - text: . The city library was founded in 1959. The central library of the
                - link "Weihenstephan-Triesdorf University of Applied Sciences" [ref=e597] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Weihenstephan-Triesdorf_University_of_Applied_Science
                - text: is located in the
                - link "Hofgarten" [ref=e598] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Hofgarten_(Munich)
                - text: in
                - link "Weihenstephan" [ref=e599] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Weihenstephan
                - text: . Also in
                - link "Weihenstephan" [ref=e600] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Weihenstephan
                - text: is a branch library of the University Library of the
                - link "Technical University of Munich" [ref=e601] [cursor=pointer]:
                  - /url: https://en.wikipedia.org/wiki/Technical_University_of_Munich
                - text: .
            - region [ref=e602]:
              - generic [ref=e603]:
                - heading "City archive" [level=3] [ref=e604]
                - link "edit" [ref=e606] [cursor=pointer]:
                  - /url: /w/index.php?title=Freising&action=edit&section=9
              - paragraph [ref=e607]: The Stadtarchiv Freising is a scientific institution of the city of Freising. It holds documents from the 14th century to the present day. It has existed as an institution since 1909. It is a public institution, open to all citizens and offers a reference library with about 4500 volumes in a reading room.
              - paragraph [ref=e608]: Since 2003, the Freising Municipal Archives have been temporarily located in the "Haus der Vereine" (House of Associations), a barracks building of the Jägerkaserne (Vimy Barracks from 1938), which was built in 1906 and has since been abandoned. It will remain in this listed building until a new building is realized in Fischergasse, east of the former prison.
          - region [ref=e609]:
            - generic [ref=e610]:
              - heading "Transport" [level=2] [ref=e611]
              - link "edit" [ref=e613] [cursor=pointer]:
                - /url: /w/index.php?title=Freising&action=edit&section=10
            - paragraph [ref=e614]:
              - link "Freising station" [ref=e615] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Freising_station
              - text: ", situated on the southern edge of the old town, is on the"
              - link "Munich to Regensburg railway" [ref=e616] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Munich–Regensburg_railway
              - text: . It is the northern terminus of line
              - link "S1" [ref=e618] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/S1_(Munich)
              - text: of the
              - link "Munich S-Bahn" [ref=e619] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Munich_S-Bahn
              - text: ", which connects Freising with"
              - link "Munich" [ref=e620] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Munich
              - text: at 20 minute intervals. It is also served by an hourly service on
              - link "RE 22" [ref=e622] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/List_of_railway_routes_in_Bavaria#Lines_2,_20–29_(southwest)
              - text: to/from
              - link "Munich Airport" [ref=e623] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Munich_Airport
              - text: . Other services call at the station on journeys to Munich,
              - link "Nuremberg" [ref=e624] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Nuremberg
              - text: ","
              - link "Passau" [ref=e625] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Passau
              - text: ","
              - link "Prague" [ref=e626] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Prague
              - text: and
              - link "Regensburg" [ref=e627] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Regensburg
              - text: .
            - paragraph [ref=e628]:
              - text: The
              - link "A92 motorway" [ref=e629] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Bundesautobahn_92
              - text: crosses the southern part of the city, connecting Freising to Munich and
              - link "Lower Bavaria" [ref=e630] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Lower_Bavaria
              - text: . The A92 connects to the
              - link "A99 Munich ring motorway" [ref=e631] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Bundesautobahn_99
              - text: ", which provides further connections to other parts of Bavaria and Germany."
            - paragraph [ref=e632]:
              - text: Freising has a city bus network that is integrated into the fare structure of the
              - link "Munich Transport Association" [ref=e633] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Munich_Transport_Association
              - text: (MVV). It is also connected to a number of regional bus routes, including ones to Munich Airport and the
              - link "Garching campus" [ref=e634] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Campus_Garching
              - text: of the
              - link "Technical University of Munich" [ref=e635] [cursor=pointer]:
                - /url: https://en.wikipedia.org/wiki/Technical_University_of_Munich
              - text: . All bus routes serve the railway station.
          - region [ref=e636]:
            - generic [ref=e637]:
              - heading "Twin towns – sister cities" [level=2] [ref=e638]
              - link "edit" [ref=e640] [cursor=pointer]:
                - /url: /w/index.php?title=Freising&action=edit&section=11
            - figure [ref=e641]:
              - link [ref=e642] [cursor=pointer]:
